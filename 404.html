    <script>
      (() => {
        const demoBase = "/Beginner-Martin-personal-portfolio/demos/ip-alive/";
        const requestedPath = window.location.pathname;

        if (requestedPath.startsWith(demoBase) && requestedPath !== demoBase) {
          const route = requestedPath.slice(demoBase.length) + window.location.search + window.location.hash;
          window.location.replace(`${demoBase}?__route=${encodeURIComponent(route)}`);
        }
      })();
    </script>
